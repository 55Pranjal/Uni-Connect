<svg width="500" height="500" viewBox="0 0 500 500"
     xmlns="http://www.w3.org/2000/svg">

  <g stroke="#E2E8F0"
     stroke-width="1.6"
     fill="none"
     stroke-linecap="round"
     stroke-linejoin="round">

    <!-- 🎮 Controller -->
    <g transform="translate(60,80) rotate(-15)">
      <rect x="0" y="0" rx="10" ry="10" width="60" height="30"/>
      <circle cx="20" cy="15" r="3"/>
      <circle cx="40" cy="15" r="3"/>
    </g>

    <!-- ☁️ Cloud -->
    <g transform="translate(300,70) rotate(10)">
      <path d="M20 20
               a12 12 0 0 1 24 0
               a10 10 0 0 1 6 18
               h-36
               a10 10 0 0 1 6-18z" />
    </g>

    <!-- 👥 Community -->
    <g transform="translate(120,320) rotate(-8)">
      <circle cx="0" cy="0" r="6"/>
      <circle cx="16" cy="0" r="6"/>
      <line x1="-10" y1="12" x2="26" y2="12"/>
    </g>

    <!-- ⭐ XP -->
    <g transform="translate(350,300) rotate(15)">
      <text font-family="Arial, sans-serif"
            font-size="16"
            letter-spacing="1"
            stroke="#E2E8F0">
        XP
      </text>
    </g>

    <!-- Extra scattered elements -->
    <g transform="translate(420,180) rotate(-12)">
      <circle cx="0" cy="0" r="5"/>
      <circle cx="12" cy="0" r="5"/>
    </g>

    <g transform="translate(200,420) rotate(18)">
      <rect x="0" y="0" rx="8" ry="8" width="40" height="20"/>
    </g>

  </g>
</svg>

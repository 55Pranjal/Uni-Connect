<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logomark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff5a1f" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta
      name="description"
      content="UniConnect — a campus community, chat, and collaboration app."
    />

    <!-- Open Graph / link previews (WhatsApp, Discord, iMessage, Slack, …) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UniConnect" />
    <meta property="og:title" content="UniConnect" />
    <meta
      property="og:description"
      content="The campus app that actually gets used — find classmates by skill, gather in real communities, and ship projects with people you trust."
    />
    <meta property="og:url" content="https://u-niconnect.netlify.app/" />
    <meta
      property="og:image"
      content="https://u-niconnect.netlify.app/icon-512.png"
    />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="UniConnect" />

    <!-- Twitter / X uses its own card namespace but falls back to og:* when these are absent. summary_large_image needs a 1.91:1 image to render full-width; with a 512×512 we use the smaller "summary" card. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="UniConnect" />
    <meta
      name="twitter:description"
      content="The campus app that actually gets used."
    />
    <meta
      name="twitter:image"
      content="https://u-niconnect.netlify.app/icon-512.png"
    />

    <title>UniConnect</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
